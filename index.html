<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>

<body>

    <div class="container">

        <div class="todo-box">

            <div class="header">

                <h1>📝 TaskFlow Pro</h1>

                <button id="themeToggle">
                    🌙
                </button>

            </div>

            <!-- Add Task -->

            <div class="input-section">

                <input type="text"
                    id="taskInput"
                    placeholder="Enter Task">

                <input type="datetime-local"
                    id="taskDate">

                <select id="priority">

                    <option value="High">
                        🔴 High
                    </option>

                    <option value="Medium">
                        🟡 Medium
                    </option>

                    <option value="Low">
                        🟢 Low
                    </option>

                </select>

                <select id="category">

                    <option value="Study">
                        📚 Study
                    </option>

                    <option value="Work">
                        💼 Work
                    </option>

                    <option value="Personal">
                        🏠 Personal
                    </option>

                    <option value="Fitness">
                        🏋 Fitness
                    </option>

                </select>

                <button id="addBtn">
                    <i class="fas fa-plus"></i>
                </button>

            </div>

            <!-- Search -->

            <input
                type="text"
                id="searchTask"
                placeholder="🔍 Search Tasks">

            <!-- Stats -->

            <div class="stats">

                <div class="card">
                    <h3 id="totalTasks">0</h3>
                    <p>Total</p>
                </div>

                <div class="card">
                    <h3 id="completedTasks">0</h3>
                    <p>Completed</p>
                </div>

                <div class="card">
                    <h3 id="pendingTasks">0</h3>
                    <p>Pending</p>
                </div>

            </div>

            <!-- Progress -->

            <div class="progress-container">

                <div class="progress-bar"
                    id="progressBar">
                </div>

            </div>

            <p id="progressText">
                0% Completed
            </p>

            <!-- Filters -->

            <div class="filters">

                <button onclick="filterTasks('all')">
                    All
                </button>

                <button onclick="filterTasks('active')">
                    Active
                </button>

                <button onclick="filterTasks('completed')">
                    Completed
                </button>

            </div>

            <!-- Task List -->

            <ul id="taskList"></ul>

        </div>

    </div>

    <!-- Toast -->

    <div id="toast"></div>

    <script src="script.js"></script>

</body>

</html>
